name: CI Matrix & Syntax Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax and Compilation Check
        run: |
          python -m py_compile optimizer.py
          python -m py_compile followup.py

      - name: Test CLI Help Menus
        run: |
          python optimizer.py --help
          python followup.py --help

      - name: Test Follow-up Generator
        run: |
          python followup.py --company "Test Corp" --role "QA Analyst" --name "Rishad Haque" --email "rishad@rishadhaque.com" --log
